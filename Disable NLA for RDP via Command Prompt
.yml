id: Y70P_pEBdEckT3CrURsr
logsource:
  product: windows
title: Disable NLA for RDP via Command Prompt
description: >-
  Disables network level authentication NLA for RDP by changing a registry key
  via Command Prompt Disabling NLA for RDP can allow remote user interaction
  with the Windows sign in screen prior to authentication
tags: []
falsepositives: []
level: high
status: experimental
references: []
author: Kareem Tahoun
detection:
  selection_1:
    - process.file.path|endswith: \reg.exe
    - process.name: reg.exe
  selection_2:
    process.command_line|contains|all:
      - add
      - \CurrentControlSet\Control\Terminal Server
      - REG_DWORD
      - /f
  selection_3:
    process.command_line|contains:
      - WinStations\RDP-Tcp
      - MaxInstanceCount
      - fEnableWinStation
      - TSUserEnabled
      - TSEnabled
      - TSAppCompat
      - IdleWinStationPoolCount
      - TSAdvertise
      - AllowTSConnections
      - fSingleSessionPerUser
      - fDenyTSConnections
  condition: selection_1 and  selection_2 and selection_3