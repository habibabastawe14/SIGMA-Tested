id: GZetBpABdEckT3CrDE5r
logsource:
  product: windows
title: Suspicious_Export_Functionalities_Rundll32
description: >-
  Consider monitoring for instances of rundll32.exe running Windows native DLLs
  that have export functionalities that adversaries commonly leverage for
  executing malicious code and evading defensive controls. The following
  pseudo-analytic applies specifically to adversaries who use the MiniDump
  export functionality of comsvcs.dll to dump the contents of LSASS, but this
  logic could be adapted to detect other malicious activity as well. Part of the
  RedCanary 2024 Threat Detection Report.
tags:
  - attack.defense_evasion
  - attack.t1218
  - attack.t1218.011
  - attack.credential_access
  - attack.t1003
falsepositives:
  - Unknown
level: low
status: experimental
references:
  - 'https://redcanary.com/threat-detection-report/techniques/rundll32/'
author: Kareem Tahoun
detection:
  condition: selection1 and selection2 and selection3
  selection1:
    process.file.path|endswith:
      - \rundll32.exe
  selection2:
    process.command_line|contains:
      - comsvcs.dll
  selection3:
    process.command_line|contains:
      - MiniDump
      - '#24'