id: pYGzeJABdEckT3CrDJYt
logsource:
  product: windows
title: Invoke-Obfuscation_Obfuscated_IEX_Invocation
description: >-
  Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the following code block u2014
tags:
  - attack.defense_evasion
  - attack.t1027
  - attack.execution
  - attack.t1059.001
falsepositives:
  - Unknown
level: high
status: test
references:
  - >-
    https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
author: Kareem Tahoun
detection:
  selection_iex:
    - powershell.file.script_block_text|re: '\$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\['
    - powershell.file.script_block_text|re: '\$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\['
    - powershell.file.script_block_text|re: '\$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\['
    - powershell.file.script_block_text|re: '\$env:ComSpec\[(\s*\d{1,3}\s*,){2}'
    - powershell.file.script_block_text|re: \*mdr\*\W\s*\)\.Name
    - powershell.file.script_block_text|re: \$VerbosePreference\.ToString\(
  condition: selection_iex