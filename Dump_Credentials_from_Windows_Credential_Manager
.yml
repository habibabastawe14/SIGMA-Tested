id: YxDHY5ABdEckT3CrDfT_
logsource:
  product: windows
title: Dump_Credentials_from_Windows_Credential_Manager
description: >-
  Adversaries may search for common password storage locations to obtain user
  credentials. Passwords are stored in several places on a system, depending on
  the operating system or application holding the credentials.
tags:
  - attack.credential_access
  - attack.t1555
falsepositives:
  - Unknown
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555/T1555.md
author: Kareem Tahoun
detection:
  selection_kiddie:
    powershell.file.script_block_text|contains:
      - Get-PasswordVaultCredentials
      - Get-CredManCreds
  selection_rename_Password:
    powershell.file.script_block_text|contains|all:
      - New-Object
      - Windows.Security.Credentials.PasswordVault
  selection_rename_credman:
    powershell.file.script_block_text|contains|all:
      - New-Object
      - Microsoft.CSharp.CSharpCodeProvider
      - >-
        [System.Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory())
      - Collections.ArrayList
      - System.CodeDom.Compiler.CompilerParameters
  condition: 1 of selection_*