id: HAr22o8B13klLU7QwWLb
logsource:
  product: windows
title: Certificate_Exported_Via_PowerShell
description: >-
  Detects calls to cmdlets that are used to export certificates from the local
  certificate store. Threat actors were seen abusing this to steal private keys
  from compromised machines.
tags:
  - attack.credential_access
  - attack.execution
  - attack.t1552.004
  - attack.t1059.001
falsepositives:
  - >-
    Legitimate certificate exports by administrators. Additional filters might
    be required.
level: medium
status: test
references:
  - 'https://us-cert.cisa.gov/ncas/analysis-reports/ar21-112a'
  - 'https://docs.microsoft.com/en-us/powershell/module/pki/export-pfxcertificate'
  - >-
    https://www.splunk.com/en_us/blog/security/breaking-the-chain-defending-against-certificate-services-abuse.html
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    process.command_line|contains:
      - 'Export-PfxCertificate '
      - 'Export-Certificate '