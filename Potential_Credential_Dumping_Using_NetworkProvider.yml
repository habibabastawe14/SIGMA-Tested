id: KmZbBJABdEckT3CralE4
logsource:
  product: windows
title: Potential_Credential_Dumping_Using_NetworkProvider
description: >-
  Detects when an attacker tries to add a new network provider in order to dump
  clear text credentials, similar to how the NPPSpy tool does it
tags:
  - attack.credential_access
  - attack.t1003
falsepositives:
  - Other legitimate network providers used and not filtred in this rule
level: high
status: test
references:
  - >-
    https://docs.microsoft.com/en-us/troubleshoot/windows-client/deployment/network-provider-settings-removed-in-place-upgrade
  - 'https://github.com/gtworek/PSBits/tree/master/PasswordStealing/NPPSpy'
author: Kareem Tahoun
detection:
  condition: selection and Selection_2
  selection:
    process.command_line|contains:
      - \SYSTEM\CurrentControlSet\Services\
  Selection_2:
    process.command_line|contains:
      - \NetworkProvider