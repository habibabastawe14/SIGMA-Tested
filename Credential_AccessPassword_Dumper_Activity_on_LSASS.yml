id: tcQgt48BhqrVAqkqz5z_
logsource:
  product: windows
title: Credential_AccessPassword_Dumper_Activity_on_LSASS
description: >-
  Detects process handle on LSASS process with certain access mask and object
  type SAM_DOMAIN
tags:
  - attack.credential_access
  - attack.t1003.001
falsepositives:
  - Unknown
level: high
status: test
references:
  - 'https://twitter.com/jackcr/status/807385668833968128'
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    winlog.event_id:
      - 4656
    winlog.event_data.ObjectName|endswith:
      - \lsass.exe
    winlog.event_data.AccessMask:
      - '0x705'
    winlog.event_data.ObjectType:
      - SAM_DOMAIN