id: Ei6v1Y8B13klLU7QrExh
logsource:
  product: windows
title: Credential_Access_Kerberos_AsRep_Roasting_Ticket
description: >-
  Detects scenarios where an attacker abuse an account with UAC settings set to
  Accounts Does not Require Pre-Authentication in order to perform offline TGT
  brutforce. May also be triggered by an attacker performing some Kerberos user
  enumration with tools like Kerbrute.
tags:
  - attack.credential_access
  - attack.t1558.004
falsepositives:
  - Account configured to not require pre-authentication
level: high
status: experimental
references:
  - >-
    https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack/tree/master/TA0006-Credential%20Access/T1558-Steal%20or%20Forge%20Kerberos%20Tickets
  - 'https://github.com/HarmJ0y/ASREPRoast'
  - >-
    https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/as-rep-roasting-using-rubeus-and-hashcat
  - >-
    https://m0chan.github.io/2019/07/31/How-To-Attack-Kerberos-101.html#as-rep-roasting
  - >-
    https://medium.com/@jsecurity101/ioc-differences-between-kerberoasting-and-as-rep-roasting-4ae179cdf9ec
  - >-
    https://rioasmara.com/2020/07/04/kerberoasting-as-req-pre-auth-vs-non-pre-auth/
  - 'https://www.hackingarticles.in/as-rep-roasting/'
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    winlog.event_id:
      - 4768
    winlog.event_data.Status:
      - '0x0'
    winlog.event_data.ServiceSid|endswith:
      - '-502'
    winlog.event_data.PreAuthType:
      - '0'
    winlog.event_data.TicketOptions:
      - '0x40800010'
      - '0x50800000 '