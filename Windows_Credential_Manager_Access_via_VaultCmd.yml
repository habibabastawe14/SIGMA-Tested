id: j7RxvI8B13klLU7QaCBv
logsource:
  product: windows
title: Windows_Credential_Manager_Access_via_VaultCmd
description: >-
  List credentials currently stored in Windows Credential Manager via the native
  Windows utility vaultcmd.exe
tags:
  - attack.credential_access
  - attack.t1555.004
falsepositives:
  - Unknown
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.004/T1555.004.md#atomic-test-1---access-saved-credentials-via-vaultcmd
author: Kareem Tahoun
detection:
  selection_img:
    - process.file.path|endswith: \VaultCmd.exe
    - process.name: VAULTCMD.EXE
  selection_cli:
    process.command_line|contains: '/listcreds:'
  condition: all of selection*