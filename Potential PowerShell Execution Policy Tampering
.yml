id: l4Lt8I4BBPPWSuEyy_gJ
logsource:
  product: windows
title: Potential PowerShell Execution Policy Tampering
description: >-
  Detects changes to the PowerShell execution policy in order to bypass signing
  requirements for script execution
tags:
  - attack.defense_evasion
falsepositives:
  - Unknown
level: medium
status: experimental
references:
  - >-
    https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/set-executionpolicy?view=powershell-7.3
author: Abdelrhman Shaban
detection:
  selection:
    TargetObject|endswith:
      - \ShellIds\Microsoft.PowerShell\ExecutionPolicy
      - \Policies\Microsoft\Windows\PowerShell\ExecutionPolicy
    Details|contains:
      - Bypass
      - Unrestricted
  filter_main_svchost:
    Image|contains:
      - ':\Windows\System32\'
      - ':\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*