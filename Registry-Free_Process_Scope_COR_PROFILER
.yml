id: W9GbSZABdEckT3Cra58t
logsource:
  product: windows
title: Registry-Free_Process_Scope_COR_PROFILER
description: >
  Adversaries may leverage the COR_PROFILER environment variable to hijack the
  execution flow of programs that load the .NET CLR.
tags:
  - attack.persistence
  - attack.t1574.012
falsepositives:
  - Legitimate administrative script
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.012/T1574.012.md#atomic-test-3---registry-free-process-scope-cor_profiler
  - 'https://redcanary.com/blog/threat-detection/cor_profiler-for-persistence/'
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    powershell.file.script_block_text|contains|all:
      - '$env:COR_ENABLE_PROFILING'
      - '$env:COR_PROFILER'
      - '$env:COR_PROFILER_PATH'