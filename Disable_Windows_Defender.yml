id: KeddT5ABdEckT3CrdgK3
logsource:
  product: windows
title: Disable_Windows_Defender
description: >-
  Detect built in PowerShell cmdlet Disable-WindowsOptionalFeature, Deployment
  Image Servicing and Management tool. Similar to DISM.exe, this cmdlet is used
  to enumerate, install, uninstall, configure, and update features and packages
  in Windows images
tags:
  - attack.defense_evasion
  - attack.t1562.001
falsepositives:
  - Unknown
level: high
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/5b67c9b141fa3918017f8fa44f2f88f0b1ecb9e1/atomics/T1562.001/T1562.001.md
  - >-
    https://docs.microsoft.com/en-us/powershell/module/dism/disable-windowsoptionalfeature?view=windowsserver2022-ps
author: Kareem Tahoun
detection:
  condition: selection_cmd and selection_feature
  selection_cmd:
    powershell.file.script_block_text|contains|all:
      - Disable-WindowsOptionalFeature
      - Online
      - FeatureName
  selection_feature:
    powershell.file.script_block_text|contains:
      - Windows-Defender-Gui
      - Windows-Defender-Features
      - Windows-Defender
      - Windows-Defender-ApplicationGuard
      - Windows-Defender-ApplicationGuard