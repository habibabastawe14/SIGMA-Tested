id: JPceC5ABdEckT3CraNdj
logsource:
  product: windows
title: Suspicious_Recursive_Takeown
description: >-
  Adversaries can interact with the DACLs using built-in Windows commands
  takeown which can grant adversaries higher permissions on specific files and
  folders
tags:
  - attack.defense_evasion
  - attack.t1222.001
falsepositives: []
level: medium
status: test
references:
  - >-
    https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/takeown
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1222.001/T1222.001.md#atomic-test-1---take-ownership-using-takeown-utility
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    process.file.path|endswith:
      - \takeown.exe
    process.command_line|contains:
      - '/f '
      - /r