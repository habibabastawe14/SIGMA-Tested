id: 3RoRwJEBdEckT3Cr73Vt
logsource:
  product: windows
title: Invoke-Mimikatz PowerShell Script
description: >-
  Detects Invoke-Mimikatz PowerShell script and alike. Mimikatz is a credential
  dumper capable of obtaining plaintext Windows account logins and passwords.
tags:
  - attack.credential-access
  - attack.t1003
falsepositives:
  - Mimikatz can be useful for testing the security of networks
level: high
status: test
references:
  - >-
    https://www.elastic.co/guide/en/security/current/potential-invoke-mimikatz-powershell-script.html#potential-invoke-mimikatz-powershell-script
author: Kareem Tahoun
detection:
  condition: selection_1 or selection_2 or selection_3
  selection_1:
    powershell.file.script_block_text|contains|all:
      - DumpCreds
      - DumpCerts
  selection_2:
    powershell.file.script_block_text|contains:
      - 'sekurlsa::logonpasswords'
  selection_3:
    powershell.file.script_block_text|contains|all:
      - 'crypto::certificates'
      - CERT_SYSTEM_STORE_LOCAL_MACHINE