id: 96tZP5ABdEckT3CrexGw
logsource:
  product: windows
title: Potential_Data_Exfiltration_Via_Audio_File
description: Detects potential exfiltration attempt via audio file using PowerShell
tags:
  - attack.exfiltration
falsepositives:
  - Unknown
level: medium
status: test
references:
  - >-
    https://github.com/gtworek/PSBits/blob/e97cbbb173b31cbc4d37244d3412de0a114dacfb/NoDLP/bin2wav.ps1
author: Kareem Tahoun
detection:
  condition: selection_main and selection_header_wav
  selection_main:
    powershell.file.script_block_text|contains|all:
      - '[System.Math]::'
      - '[IO.FileMode]::'
      - BinaryWriter
  selection_header_wav:
    powershell.file.script_block_text|contains|all:
      - '0x52'
      - '0x49'
      - '0x46'
      - '0x57'
      - '0x41'
      - '0x56'
      - '0x45'
      - '0xAC'