id: 6oqOfZABdEckT3CrFH8E
logsource:
  product: windows
title: Invoke-Obfuscation_COMPRESS_OBFUSCATION
description: Detects Obfuscated Powershell via COMPRESS OBFUSCATION
tags:
  - attack.defense_evasion
  - attack.t1027
  - attack.execution
  - attack.t1059.001
falsepositives:
  - Unknown
level: medium
status: test
references:
  - 'https://github.com/SigmaHQ/sigma/issues/1009'
author: Kareem Tahoun
detection:
  condition: selection_4104 and Selection_2 and Selection_3 and Selection_4
  selection_4104:
    powershell.file.script_block_text|contains:
      - System.IO.Compression.DeflateStream
      - SYStEm.io.sTReamrEADer
  Selection_2:
    powershell.file.script_block_text|contains:
      - New-Object
  Selection_3:
    powershell.file.script_block_text|contains:
      - ReadToEnd
  Selection_4:
    powershell.file.script_block_text|contains:
      - Text.Encoding