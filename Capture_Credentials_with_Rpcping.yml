id: wEVnGZABdEckT3CrZsbk
logsource:
  product: windows
title: Capture_Credentials_with_Rpcping
description: >-
  Detects using Rpcping.exe to send a RPC test connection to the target server
  -s and force the NTLM hash to be sent in the process.
tags:
  - attack.credential_access
  - attack.t1003
falsepositives:
  - Unlikely
level: medium
status: test
references:
  - 'https://lolbas-project.github.io/lolbas/Binaries/Rpcping/'
  - 'https://twitter.com/vysecurity/status/974806438316072960'
  - 'https://twitter.com/vysecurity/status/873181705024266241'
  - >-
    https://docs.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/hh875578(v=ws.11)
author: Kareem Tahoun
detection:
  condition: use_rpcping and remote_server and ntlm_auth
  use_rpcping:
    process.file.path|endswith:
      - \RpcPing.exe
  remote_server:
    process.command_line|contains:
      - '-s'
  ntlm_auth:
    process.command_line|contains:
      - '-u'
      - NTLM
      - '-t'
      - ncacn_np