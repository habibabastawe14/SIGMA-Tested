id: ETKGAZABdEckT3Cr2GDO
logsource:
  product: windows
title: Request_A_Single_Ticket_via_PowerShell
description: >-
  utilize native PowerShell Identity modules to query the domain to extract the
  Service Principal Names for a single computer. This behavior is typically used
  during a kerberos or silver ticket attack. A successful execution will output
  the SPNs for the endpoint in question.
tags:
  - attack.credential_access
  - attack.t1558.003
falsepositives:
  - Unknown
level: high
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1558.003/T1558.003.md#atomic-test-4---request-a-single-ticket-via-powershell
author: Kareem Tahoun
detection:
  selection:
    powershell.file.script_block_text|contains: System.IdentityModel.Tokens.KerberosRequestorSecurityToken
  condition: selection