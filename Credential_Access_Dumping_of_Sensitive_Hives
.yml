id: xZB1EY8BOtiIcGpCn-d4
logsource:
  product: windows
title: Credential_Access_Dumping_of_Sensitive_Hives
description: >-
  Detects the usage of reg.exe in order to dump sensitive registry hives. This
  includes SAM, SYSTEM and SECURITY hives.
tags:
  - attack.credential_access
  - attack.t1003.002
  - attack.t1003.004
  - attack.t1003.005
falsepositives:
  - Dumping hives for legitimate purpouse i.e. backup or forensic investigation
level: high
status: test
references:
  - >-
    https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - >-
    https://eqllib.readthedocs.io/en/latest/analytics/aed95fc6-5e3f-49dc-8b35-06508613f979.html
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003/T1003.md
  - 'https://www.wietzebeukema.nl/blog/windows-command-line-obfuscation'
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md#atomic-test-1---registry-dump-of-sam-creds-and-secrets
author: Kareem Tahoun
detection:
  condition: >-
    selection_img and selection_cli_flag and selection_cli_hklm and
    selection_cli_hive
  selection_img:
    process.file.path|endswith:
      - \reg.exe
    process.name:
      - reg.exe
  selection_cli_flag:
    process.command_line|contains:
      - ' save '
      - ' export '
      - ' ˢave '
      - ' eˣport '
  selection_cli_hklm:
    process.command_line|contains:
      - HKLM
      - hklm
      - hk˪m
      - hkey_local_machine
      - hkey_˪ocal_machine
      - hkey_loca˪_machine
      - hkey_˪oca˪_machine
  selection_cli_hive:
    process.command_line|contains:
      - \system
      - \sam
      - \security
      - \ˢystem
      - \syˢtem
      - \ˢyˢtem
      - \ˢam
      - \ˢecurity