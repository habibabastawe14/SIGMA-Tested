id: 1j8wc5ABdEckT3CrZR8O
logsource:
  product: windows
title: HackTool_Rubeus_Execution
description: Detects the execution of the hacktool Rubeus using specific command line flags
tags:
  - attack.credential_access
  - attack.t1003
  - attack.t1558.003
  - attack.lateral_movement
  - attack.t1550.003
falsepositives:
  - Unlikely
level: high
status: test
references:
  - 'https://blog.harmj0y.net/redteaming/from-kekeo-to-rubeus'
  - 'https://m0chan.github.io/2019/07/31/How-To-Attack-Kerberos-101.html'
  - 'https://github.com/GhostPack/Rubeus'
author: Kareem Tahoun
detection:
  selection:
    powershell.file.script_block_text|contains:
      - 'asreproast '
      - 'dump /service:krbtgt '
      - 'dump /luid:0x'
      - 'kerberoast '
      - 'createnetonly /program:'
      - 'ptt /ticket:'
      - '/impersonateuser:'
      - 'renew /ticket:'
      - 'asktgt /user:'
      - 'harvest /interval:'
      - 's4u /user:'
      - 's4u /ticket:'
      - 'hash /password:'
      - 'golden /aes256:'
      - 'silver /user:'
  condition: selection