id: HHh7OpABdEckT3CrxsJS
logsource:
  product: windows
title: PowerShell_ADRecon_Execution
description: >-
  Detects execution of ADRecon.ps1 for AD reconnaissance which has been reported
  to be actively used by FIN7
tags:
  - attack.discovery
  - attack.execution
  - attack.t1059.001
falsepositives:
  - Unknown
level: high
status: test
references:
  - >-
    https://github.com/sense-of-security/ADRecon/blob/11881a24e9c8b207f31b56846809ce1fb189bcc9/ADRecon.ps1
  - >-
    https://bi-zone.medium.com/from-pentest-to-apt-attack-cybercriminal-group-fin7-disguises-its-malware-as-an-ethical-hackers-c23c9a75e319
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    powershell.file.script_block_text|contains:
      - Get-ADRExcelComObj
      - Get-ADRGPO
      - Get-ADRDomainController
      - ADRecon-Report.xlsx