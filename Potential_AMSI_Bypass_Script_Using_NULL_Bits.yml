id: Hpu1O5ABdEckT3CrpQc7
logsource:
  product: windows
title: Potential_AMSI_Bypass_Script_Using_NULL_Bits
description: >-
  Detects usage of special strings null bits in order to potentially bypass AMSI
  functionalities
tags:
  - attack.defense_evasion
  - attack.t1562.001
falsepositives:
  - Unknown
level: medium
status: test
references:
  - >-
    https://github.com/r00t-3xp10it/hacking-material-books/blob/43cb1e1932c16ff1f58b755bc9ab6b096046853f/obfuscation/simple_obfuscation.md#amsi-bypass-using-null-bits-satoshi
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    powershell.file.script_block_text|contains:
      - ' if(0){{{0}}}'' -f $(0 -as [char]) + '
      - ' #<NULL> '