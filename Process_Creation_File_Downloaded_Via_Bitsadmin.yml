id: DKyPMY8BOtiIcGpCSdcK
logsource:
  product: windows
title: Process_Creation_File_Downloaded_Via_Bitsadmin
description: Detects usage of bitsadmin downloading a file with a suspicious extension
tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.t1197
  - attack.s0190
  - attack.t1036.003
falsepositives:
  - Unknown
level: high
status: test
references:
  - 'https://blog.netspi.com/15-ways-to-download-a-file/#bitsadmin'
  - 'https://isc.sans.edu/diary/22264'
  - 'https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/'
author: Kareem Tahoun
detection:
  condition: selection_img and selection_flags and selection_extension
  selection_img:
    process.file.path|endswith:
      - \bitsadmin.exe
    process.name:
      - bitsadmin.exe
  selection_flags:
    process.command_line|contains:
      - ' /transfer '
      - ' /create '
      - ' /addfile '
  selection_extension:
    process.command_line|contains:
      - .7z
      - .asax
      - .ashx
      - .asmx
      - .asp
      - .aspx
      - .bat
      - .cfm
      - .cgi
      - .chm
      - .cmd
      - .dll
      - .gif
      - .jpeg
      - .jpg
      - .jsp
      - .jspx
      - .log
      - .png
      - .ps1
      - .psm1
      - .rar
      - .scf
      - .sct
      - .txt
      - .vbe
      - .vbs
      - .war
      - .wsf
      - .wsh
      - .xll
      - .zip