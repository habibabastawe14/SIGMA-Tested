id: Pz2jGJABdEckT3CroVfJ
logsource:
  product: windows
title: Copying_Sensitive_Files_with_Credential_Data
description: Files with well known filenames sensitive files with credential data copying
tags:
  - attack.credential_access
  - attack.t1003.002
  - attack.t1003.003
  - attack.s0404
falsepositives:
  - >-
    Copying sensitive files for legitimate use (eg. backup) or forensic
    investigation by legitimate incident responder or forensic invetigator
level: high
status: test
references:
  - >-
    https://room362.com/post/2013/2013-06-10-volume-shadow-copy-ntdsdit-domain-hashes-remotely-part-1/
  - >-
    https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - >-
    https://dfironthemountain.wordpress.com/2018/12/06/locked-file-access-using-esentutl-exe/
  - >-
    https://github.com/LOLBAS-Project/LOLBAS/blob/2cc01b01132b5c304027a658c698ae09dd6a92bf/yml/OSBinaries/Esentutl.yml
author: Kareem Tahoun
detection:
  condition: selection_esent_img and selection_esent_cli and selection_susp_paths
  selection_esent_img:
    process.file.path|endswith:
      - \esentutl.exe
  selection_esent_cli:
    process.command_line|contains:
      - vss
      - ' /m '
      - ' /y '
  selection_susp_paths:
    process.command_line|contains:
      - \windows\ntds\ntds.dit
      - \config\sam
      - \config\security
      - '\config\system '
      - \repair\sam
      - \repair\system
      - \repair\security
      - \config\RegBack\sam
      - \config\RegBack\system
      - \config\RegBack\security