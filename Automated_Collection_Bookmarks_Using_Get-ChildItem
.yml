id: WTGKcJABdEckT3Cr73KL
logsource:
  product: windows
title: Automated_Collection_Bookmarks_Using_Get-ChildItem
description: >-
  Adversaries may enumerate browser bookmarks to learn more about compromised
  hosts. Browser bookmarks may reveal personal information about users ex
  banking sites interests social media etc as well as details about internal
  network resources such as servers, tools dashboards, or other related
  infrastructure.
tags:
  - attack.discovery
  - attack.t1217
falsepositives:
  - Unknown
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1217/T1217.md
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    powershell.file.script_block_text|contains|all:
      - Get-ChildItem
      - ' -Recurse '
      - ' -Path '
      - ' -Filter Bookmarks'
      - ' -ErrorAction SilentlyContinue'
      - ' -Force'
















      
