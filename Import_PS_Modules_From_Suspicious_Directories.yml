id: TW6vc5ABdEckT3CrxyQ6
logsource:
  product: windows
title: Import_PS_Modules_From_Suspicious_Directories
description: Detects powershell scripts that import modules from suspicious directories
tags:
  - attack.execution
  - attack.t1059.001
falsepositives:
  - Unknown
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md
author: Kareem Tahoun
detection:
  selection:
    powershell.file.script_block_text|contains:
      - 'Import-Module "$Env:Temp\'
      - 'Import-Module ''$Env:Temp\'
      - 'Import-Module $Env:Temp\'
      - 'Import-Module "$Env:Appdata\'
      - 'Import-Module ''$Env:Appdata\'
      - 'Import-Module $Env:Appdata\'
      - 'Import-Module C:\Users\Public\'
      - 'ipmo "$Env:Temp\'
      - 'ipmo ''$Env:Temp\'
      - 'ipmo $Env:Temp\'
      - 'ipmo "$Env:Appdata\'
      - 'ipmo ''$Env:Appdata\'
      - 'ipmo $Env:Appdata\'
      - 'ipmo C:\Users\Public\'
  condition: selection