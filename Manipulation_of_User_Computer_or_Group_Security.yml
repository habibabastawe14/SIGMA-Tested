id: 5eQkT5ABdEckT3CrfKjn
logsource:
  product: windows
title: Manipulation_of_User_Computer_or_Group_Security
description: >-
  Adversaries may create a domain account to maintain access to victim systems.
  Domain accounts are those managed by Active Directory Domain Services where
  access and permissions are configured across systems and services that are
  part of that domain..
tags:
  - attack.persistence
  - attack.t1136.002
falsepositives:
  - Legitimate administrative script
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1136.002/T1136.002.md#atomic-test-3---create-a-new-domain-account-using-powershell
  - >-
    https://docs.microsoft.com/en-us/dotnet/api/system.directoryservices.accountmanagement?view=dotnet-plat-ext-6.0
author: Kareem Tahoun
detection:
  selection:
    powershell.file.script_block_text|contains: System.DirectoryServices.AccountManagement
  condition: selection