id: 46MYP5ABdEckT3Crasit
logsource:
  product: windows
title: Silence_EDA_Detection
description: Detects Silence EmpireDNSAgent as described in the Group-IP report
tags:
  - attack.execution
  - attack.t1059.001
  - attack.command_and_control
  - attack.t1071.004
  - attack.t1572
  - attack.impact
  - attack.t1529
  - attack.g0091
  - attack.s0363
falsepositives:
  - Unknown
level: critical
status: test
references:
  - >-
    https://www.group-ib.com/resources/threat-research/silence_2.0.going_global.pdf
author: Kareem Tahoun
detection:
  empire:
    powershell.file.script_block_text|contains|all:
      - System.Diagnostics.Process
      - Stop-Computer
      - Restart-Computer
      - Exception in execution
      - $cmdargs
      - Close-Dnscat2Tunnel
  dnscat:
    powershell.file.script_block_text|contains|all:
      - set type=$LookupType`nserver
      - $Command | nslookup 2>&1 | Out-String
      - New-RandomDNSField
      - '[Convert]::ToString($SYNOptions, 16)'
      - $Session.Dead = $True
      - '$Session["Driver"] -eq'
  condition: empire and dnscat