id: _HeMeJABdEckT3Cr_tk4
logsource:
  product: windows
title: Execute_Invoke-command_on_Remote_Host
description: >-
  Adversaries may use Valid Accounts to interact with remote systems using
  Windows Remote Management WinRM. The adversary may then perform actions as the
  logged-on user.
tags:
  - attack.lateral_movement
  - attack.t1021.006
falsepositives:
  - Legitimate script
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.006/T1021.006.md#atomic-test-2---invoke-command
  - >-
    https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/invoke-command?view=powershell-7.4
author: Kareem Tahoun
detection:
  condition: selection_cmdlet
  selection_cmdlet:
    powershell.file.script_block_text|contains:
      - Invoke-Command
  Selection_2:
    powershell.file.script_block_text|contains:
      - '-ComputerName'