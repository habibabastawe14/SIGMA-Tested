id: An6geJABdEckT3CrYpXb
logsource:
  product: windows
title: Powershell_DNSExfiltration
description: >-
  DNSExfiltrator allows for transferring exfiltrate a file over a DNS request
  covert channel
tags:
  - attack.exfiltration
  - attack.t1048
falsepositives:
  - Legitimate script
level: high
status: test
references:
