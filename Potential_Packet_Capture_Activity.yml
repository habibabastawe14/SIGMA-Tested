id: Rbofwo8B13klLU7Q_oIg
logsource:
  product: windows
title: Potential_Packet_Capture_Activity
description: >-
  Detects the execution of powershell scripts with calls to the Start
  NetEventSession cmdlet. Which allows an attacker to start event and packet
  capture for a network event session. Adversaries may attempt to capture
  network to gather information over the course of an operation. Data captured
  via this technique may include user credentials, especially those sent over an
  insecure, unencrypted protocol.
tags:
  - attack.credential_access
  - attack.discovery
  - attack.t1040
falsepositives:
  - Legitimate network diagnostic scripts.
level: medium
status: experimental
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/5f866ca4517e837c4ea576e7309d0891e78080a8/atomics/T1040/T1040.md#atomic-test-16---powershell-network-sniffing
  - >-
    https://github.com/0xsyr0/Awesome-Cybersecurity-Handbooks/blob/7b8935fe4c82cb64d61343de1a8b2e38dd968534/handbooks/10_post_exploitation.md
  - >-
    https://github.com/forgottentq/powershell/blob/9e616363d497143dc955c4fdce68e5c18d28a6cb/captureWindows-Endpoint.ps1#L13
author: Kareem Tahoun
detection:
  condition: selection
  selection:
    powershell.command.value|contains:
      - Start-NetEventSession