id: IKKL85EBdEckT3CreX_i
logsource:
  product: windows
title: Detect LaZagne Database Credential Extraction
description: >-
  Detects the execution of LaZagne with the database argument  which is often
  used for harvesting database credentials
tags: []
falsepositives: []
level: medium
status: test
references: []
author: Kareem Tahoun
detection:
  condition: Selection_1 and Selection_2
  Selection_1:
    process.name|contains:
      - LaZagne.exe
    process.file.path|contains:
      - \LaZagne.exe
  Selection_2:
    process.command_line|contains:
      - databases