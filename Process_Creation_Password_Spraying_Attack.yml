id: krifMY8BOtiIcGpC0Yrs
logsource:
  product: windows
title: Process_Creation_Password_Spraying_Attack
description: Detects possible password spraying attempts using Dsacls.exe
tags:
  - attack.defense_evasion
  - attack.t1218
falsepositives:
  - Legitimate use of dsacls to bind to an LDAP session
level: medium
status: test
references:
  - >-
    https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/using-dsacls-to-check-ad-object-permissions#password-spraying-anyone
  - 'https://ss64.com/nt/dsacls.html'
  - >-
    https://docs.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc771151(v=ws.11)
author: Kareem Tahoun
detection:
  condition: selection_img and selection_cli
  selection_img:
    process.file.path|endswith:
      - \dsacls.exe
    process.name:
      - DSACLS.EXE
  selection_cli:
    winlog.event_data.CommandLine|contains:
      - '/user:'
      - '/passwd:'