id: MWneL5ABdEckT3Crl7--
logsource:
  product: windows
title: Access_to_Browser_Login_Data
description: >-
  Adversaries may acquire credentials from web browsers by reading files
  specific to the target browser. Web browsers commonly save credentials such as
  website usernames and passwords so that they do not need to be entered
  manually in the future. Web browsers typically store the credentials in an
  encrypted format within a credential store.
tags:
  - attack.credential_access
  - attack.t1555.003
falsepositives:
  - Unknown
level: medium
status: test
references:
  - >-
    https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.003/T1555.003.md
author: Kareem Tahoun
detection:
  condition: selection_cmd and selection_path
  selection_cmd:
    powershell.file.script_block_text|contains:
      - Copy-Item
      - '-Destination'
  selection_path:
    powershell.file.script_block_text|contains:
      - \Opera Software\Opera Stable\Login Data
      - \Mozilla\Firefox\Profiles
      - \Microsoft\Edge\User Data\Default
      - \Google\Chrome\User Data\Default\Login Data
      - \Google\Chrome\User Data\Default\Login Data For Account